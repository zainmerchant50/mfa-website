<!doctype html><html><head><meta charset="utf-8"/><link rel="stylesheet" href="_base.css"/><style>
:root{--w:1200px;--h:630px}
body{background:radial-gradient(110% 120% at 100% 0%,#1B3557 0%,#10233F 55%,#0C1B31 100%);position:relative}
.wrap{position:absolute;inset:70px 84px 62px}
h1{font-family:Cormorant,serif;font-weight:400;font-size:74px;line-height:1.04;margin-top:24px;max-width:1000px}
h1 em{color:var(--gold-b);font-style:italic}
.dates{display:flex;gap:14px;margin-top:34px;flex-wrap:wrap}
.dates span{border:1px solid rgba(216,183,105,.55);border-radius:999px;padding:10px 20px;font-size:17px;font-weight:600;letter-spacing:.06em;color:var(--gold-b)}
.dates span.on{background:var(--gold-b);color:var(--navy)}
.foot{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end}
.foot>span{font-size:14px;letter-spacing:.2em;text-transform:uppercase;font-weight:600;color:rgba(255,255,255,.6)}
</style></head><body><div class="frame"></div><div class="wrap">
  <span class="eyebrow">MFA Insights · Accounting &amp; Tax</span>
  <h1>AI in accounting and tax: <em>what the IRS says in 2026</em></h1>
  <div class="dates"><span class="on">IRS AI guidelines</span><span>Verify AI answers</span><span>Protect your data</span></div>
  <div class="foot"><div class="brandline"><img src="logo.png"/><span><b>Merchant</b><i>Financial Advisory</i></span></div><span>mfa-advisory.com</span></div>
</div></body></html>
