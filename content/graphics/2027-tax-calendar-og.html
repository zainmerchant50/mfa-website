<!doctype html><html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="_base.css"/>
<style>
:root{--w:1200px;--h:630px}
body{background:radial-gradient(110% 120% at 100% 0%,#1B3557 0%,#10233F 55%,#0C1B31 100%);position:relative}
.wrap{position:absolute;inset:70px 84px 62px}
.big{font-family:Cormorant,serif;font-weight:400;font-size:150px;line-height:.9;color:var(--gold-b);margin-top:18px;font-style:italic}
h1{font-family:Cormorant,serif;font-weight:400;font-size:60px;line-height:1.05;margin-top:6px}
.dates{display:flex;gap:12px;margin-top:24px}
.dates span{border:1px solid rgba(216,183,105,.55);border-radius:999px;padding:9px 18px;font-size:16px;font-weight:600;letter-spacing:.06em;color:var(--gold-b)}
.foot{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end}
.foot>span{font-size:14px;letter-spacing:.2em;text-transform:uppercase;font-weight:600;color:rgba(255,255,255,.6)}
</style></head><body>
<div class="frame"></div>
<div class="wrap">
  <span class="eyebrow">MFA Insights · Tax Deadlines</span>
  <div class="big">2027</div>
  <h1>Tax calendar: IRS, New Jersey &amp; New York</h1>
  <div class="dates"><span>Feb 1</span><span>Mar 15</span><span>Apr 15</span><span>Jun 15</span><span>Sep 15</span><span>Oct 15</span></div>
  <div class="foot"><div class="brandline"><img src="logo.png"/><span><b>Merchant</b><i>Financial Advisory</i></span></div><span>mfa-advisory.com</span></div>
</div>
</body></html>
