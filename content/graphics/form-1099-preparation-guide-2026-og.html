<!doctype html><html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="_base.css"/>
<style>
:root{--w:1200px;--h:630px}
body{background:radial-gradient(110% 120% at 100% 0%,#1B3557 0%,#10233F 55%,#0C1B31 100%);position:relative}
.wrap{position:absolute;inset:70px 84px 62px}
.big{font-family:Cormorant,serif;font-weight:400;font-size:132px;line-height:.95;color:var(--gold-b);margin-top:30px;font-style:italic}
h1{font-family:Cormorant,serif;font-weight:400;font-size:54px;line-height:1.08;margin-top:16px;max-width:820px}
.ring{position:absolute;right:-90px;top:-90px;width:420px;height:420px;border-radius:50%;border:1px solid rgba(216,183,105,.28)}
.ring2{position:absolute;right:30px;top:30px;width:180px;height:180px;border-radius:50%;border:1px solid rgba(216,183,105,.18)}
.foot{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end}
.foot>span{font-size:14px;letter-spacing:.2em;text-transform:uppercase;font-weight:600;color:rgba(255,255,255,.6)}
</style></head><body>
<div class="ring"></div><div class="ring2"></div><div class="frame"></div>
<div class="wrap">
  <span class="eyebrow">MFA Insights · Bookkeeping &amp; 1099s</span>
  <div class="big">Form 1099s</div>
  <h1>The new $2,000 rule, who gets one, and how to file right the first time.</h1>
  <div class="foot"><div class="brandline"><img src="logo.png"/><span><b>Merchant</b><i>Financial Advisory</i></span></div><span>mfa-advisory.com</span></div>
</div>
</body></html>
